[workspace]
name = "v2-docs"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
# pixi run figures ../../V2_FEATURE_REQUESTS.md   # render ```mermaid blocks (needs network)
# pixi run pdf     ../../V2_FEATURE_REQUESTS.md   # pandoc + tectonic -> V2_FEATURE_REQUESTS.pdf
figures = "python render-mermaid.py"
pdf = "bash build-pdf.sh"

[dependencies]
pandoc = ">=3.1"
tectonic = ">=0.15"
python = ">=3.11"
fonts-conda-forge = ">=1,<2"
font-ttf-dejavu = ">=2.37,<3"
